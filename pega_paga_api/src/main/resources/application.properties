spring.application.name=pega_paga

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/pega_paga}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

server.port=1483
server.error.include-message=always

app.jwt.secret=${APP_JWT_SECRET:change-me-change-me-change-me-change-me-1234567890}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}
app.bootstrap.super-admin.name=${APP_SUPER_ADMIN_NAME:Super Admin}
app.bootstrap.super-admin.phone=${APP_SUPER_ADMIN_PHONE:258840000000}
app.bootstrap.super-admin.password=${APP_SUPER_ADMIN_PASSWORD:admin123}
